apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerotrust-audit
  labels:
    app: audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit
  template:
    metadata:
      labels:
        app: audit
    spec:
      containers:
      - name: audit
        image: <your-account-id>.dkr.ecr.<your-region>.amazonaws.com/zerotrust-audit:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
spec:
  type: ClusterIP
  selector:
    app: audit
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
