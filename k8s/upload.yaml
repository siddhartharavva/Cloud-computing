apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerotrust-upload
  labels:
    app: upload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: upload
  template:
    metadata:
      labels:
        app: upload
    spec:
      containers:
      - name: upload
        image: <your-account-id>.dkr.ecr.<your-region>.amazonaws.com/zerotrust-upload:latest
        ports:
        - containerPort: 80
        env:
        # Define necessary AWS environment variables or use IAM Roles for Service Accounts (IRSA)
        - name: DYNAMODB_TABLE_NAME
          value: "ZeroTrustFiles"
---
apiVersion: v1
kind: Service
metadata:
  name: upload-service
spec:
  type: ClusterIP
  selector:
    app: upload
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
