apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerotrust-upload
  labels:
    app: upload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: upload
  template:
    metadata:
      labels:
        app: upload
    spec:
      containers:
      - name: upload
        image: 494003775847.dkr.ecr.eu-north-1.amazonaws.com/zerotrust-upload:latest
        ports:
        - containerPort: 80
        envFrom:
        - secretRef:
            name: backend-env
---
apiVersion: v1
kind: Service
metadata:
  name: upload-service
spec:
  type: ClusterIP
  selector:
    app: upload
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
